<html lang="en">

        <meta charset="utf-8">
        <title>A10 Cookies and Ethics</title>
    </head>
    <body>
        <h1>Cookies Demo</h1>
        <p id="message"></p>

        <script>
            if (document.cookie.includes("username=")){
                //the cookie exists and is shown
                let name = document.cookie.split("username=")[1].split(".")[0];
                document.getElementById("message").textContent = "Welcome back, " + name + "!";
            } else {
                
            }
        </script>
